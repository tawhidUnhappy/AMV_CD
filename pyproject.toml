[project]
name = "amv-cd"
version = "0.1.0"
description = "Isolated AMV pipeline: Mirai Nikki S1 x 'Black Salt Halo'"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Song transcription with word-level timestamps (drives the lyric karaoke).
    "whisperx>=3.4.2",
    # Torch comes from the CUDA index below (bundles its own cuDNN 9 in torch/lib).
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "numpy>=1.26,<2.3",
    # ctranslate2 4.4 (pinned by whisperx 3.4) imports pkg_resources and links
    # cuDNN 8 — neither is satisfied by torch's own runtime.
    "setuptools<81",
    # Windows only: torch's Windows wheel doesn't declare an nvidia-cudnn-cu12
    # dependency (it bundles cuDNN 9 in torch/lib instead), so this pin is free
    # to ask for 8.x for ctranslate2. On Linux, torch's wheel hard-pins
    # nvidia-cudnn-cu12==9.x itself — pinning <9 here would conflict with that
    # and make the project unresolvable, so on Linux we take torch's cuDNN 9
    # and rely on ctranslate2 tolerating it (see amv/audio/torch_compat.py).
    "nvidia-cudnn-cu12>=8.9,<9; sys_platform == 'win32'",
    "librosa>=0.11.0",
    "demucs>=4.1.0",
    # OCR for PGS/bitmap subtitle tracks (amv/subs/pgs_ocr.py) — currently a
    # transitive whisperx dep too, but pinned explicitly so a future whisperx
    # release can't drop it below what LightOnOCR-2-1B requires.
    "transformers>=5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
# Windows and Linux only (the two platforms this has actually been run on).
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    # Every zip() here pairs sequences built to the same length in the same
    # function (slots/frames, phrases/positions); strict= would add noise
    # without catching anything real.
    "B905",
]
